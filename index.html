<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Oso AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>

  <!-- Look-at -->
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

  <!-- AR.js con GPS -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <!-- Extras (para animaciones GLB) -->
  <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false"
  arjs="sourceType: webcam; debugUIEnabled: false;"
>

  <!-- ====== ASSETS ====== -->
  <a-assets>
    <a-asset-item id="oso-model" src="archivos/oso.glb"></a-asset-item>
  </a-assets>

  <!-- ====== MODELO 3D POR UBICACIÓN ====== -->
  <a-entity
    gps-entity-place="latitude: 5.684774923599174; longitude: -72.94806046975157;"
    look-at="[gps-camera]"
    gltf-model="#oso-model"
    animation-mixer
    scale="5 5 5"
    position="0 1.5 0"
  ></a-entity>

  <!-- ====== CÁMARA GPS ====== -->
  <a-camera gps-camera rotation-reader></a-camera>

</a-scene>

</body>
</html>
