<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Prueba Modelo Oso</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>

<a-scene>
  <a-assets>
    <a-asset-item id="oso-model" src="archivos/oso.glb"></a-asset-item>
  </a-assets>

  <!-- MODELO FRENTE A LA CÁMARA -->
  <a-entity
    gltf-model="#oso-model"
    animation-mixer
    position="0 0 -3"
    scale="1 1 1"
  ></a-entity>

  <!-- CÁMARA NORMAL -->
  <a-camera position="0 1.6 0"></a-camera>
</a-scene>

</body>
</html>
